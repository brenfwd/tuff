[package]
name = "rust-bots"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "bots"
crate-type = ["cdylib", "rlib"]

[dependencies]
tuff-plugin-sdk = { path = "../../crates/tuff-plugin-sdk" }
tuff-bots-api = { path = "api" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
