[package]
name = "rust-discord-relay"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "discord_relay"
crate-type = ["cdylib"]

[dependencies]
tuff-plugin-sdk = { path = "../../crates/tuff-plugin-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

