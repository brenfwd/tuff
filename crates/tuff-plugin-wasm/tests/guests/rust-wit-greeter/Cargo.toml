[package]
name = "rust-wit-greeter"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "wit_greeter"
crate-type = ["cdylib"]

[dependencies]
tuff-plugin-sdk = { path = "../../../../tuff-plugin-sdk", features = ["raw-abi"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
