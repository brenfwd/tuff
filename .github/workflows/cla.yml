# CLA Assistant (contributor-assistant/github-action).
#
# Disabled until the owner sets it up:
#   1. Create a branch (e.g. `cla-signatures`) or a separate repository to
#      store signatures, and set `branch` / `remote-repository-name` below.
#   2. Create a fine-grained personal access token with contents read/write on
#      that storage location and add it as the repository secret
#      `CLA_PERSONAL_ACCESS_TOKEN`. GITHUB_TOKEN is provided automatically.
#   3. Remove the `if: false` line on the job.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: bot*,dependabot[bot]
